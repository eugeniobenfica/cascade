<!-- The README's picture, drawn by cascade itself: Aurora, an example app (auroraDesktop.html,
     auroraPhone.html), on a desktop and on a phone.
     cascade-render docs/assets/src/hero.html docs/assets/heroAurora.png 1640 900 (then compressed) -->
<style>
  html, body { margin: 0; }
  body {
    width: 1640px; height: 900px; position: relative; overflow: hidden;
    background: radial-gradient(1200px 700px at 20% 10%, #2b2350 0%, transparent 70%),
                radial-gradient(900px 600px at 95% 100%, #2a1a5e 0%, transparent 70%), #111216;
  }
  .desktop {
    position: absolute; left: 64px; top: 90px; width: 1180px; height: 721px;
    border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(0, 0, 0, .4);
  }
  .desktop img { display: block; width: 1180px; height: 721px; }
  .phone {
    position: absolute; right: 80px; top: 13px; width: 388px; height: 858px;
    padding: 7px; border-radius: 58px; background: #0a0a0d; border: 1px solid #34343c;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55);

  .phone .screen { width: 388px; height: 858px; border-radius: 51px; overflow: hidden; }
  .phone img { display: block; width: 388px; height: 858px; }
</style>
<div class="desktop"><img src="../screens/auroraDesktop.png" alt=""></div>
<div class="phone"><div class="screen"><img src="../screens/auroraPhone.png" alt=""></div></div>

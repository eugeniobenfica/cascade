name: macOS

# Tier 1. Builds the library, the tools and the gallery, runs cascade-tests and the Python binding,
# the minimal build, then opens the gallery's window with each presenter and keeps what it drew.
on:
  push:
    paths: &paths
      - 'src/**'
      - '!src/platform/**'
      - 'src/platform/common/**'
      - 'src/platform/gpu/**'
      - 'src/platform/macos/**'
      - 'include/**'
      - 'tests/**'
      - 'tools/**'
      - 'examples/gallery/**'
      - 'bindings/python/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/macos.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  macos:
    name: macOS (Cocoa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cmake -S . -B build && cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Minimal build (software only, no screen readers)
        run: |
          cmake -S . -B build-min -DCASCADE_VULKAN=OFF -DCASCADE_OPENGL=OFF -DCASCADE_ACCESSIBILITY=OFF -DCASCADE_BUILD_TOOLS=OFF
          cmake --build build-min -j 4
          ctest --test-dir build-min --output-on-failure
      - name: Python binding
        run: |
          cmake -S . -B build-shared -DCASCADE_C_SHARED=ON -DCASCADE_BUILD_EXAMPLES=OFF -DCASCADE_BUILD_TESTS=OFF -DCASCADE_BUILD_TOOLS=OFF
          cmake --build build-shared -j 4
          CASCADE_LIB="$(pwd)/build-shared/libcascade_c.dylib" python3 bindings/python/testCascade.py
      - name: Open the window
        run: |
          mkdir -p shots
          for b in software opengl; do
            # the screen itself while the window is open, to look at (the runner may not allow it)
            (sleep 2; screencapture -x shots/macos-$b-screen.png || true) & grab=$!
            perl -e 'alarm 60; exec @ARGV' build/cascade-gallery --$b --screenshot shots/macos-$b.png | tee shots/macos-$b.txt
            wait $grab || true
            test -s shots/macos-$b.png
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-window
          path: shots/
